version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: abasto-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abasto-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - .:/app
    working_dir: /app
    command: npm run dev

volumes:
  mongo_data: